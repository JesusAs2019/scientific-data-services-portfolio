[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-services-portfolio"
version = "1.0.0"
description = "3-Tier Enterprise Cheminformatics & Nanomaterials Data Platform"
authors = [{ name = "Jean Pierre Assiana" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.18.0",
    "pydantic>=2.5.0",
    "SQLAlchemy>=2.0.0",
    "rdkit>=2023.9.5",
]
